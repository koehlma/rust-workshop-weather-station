[package]
name = "weather-station"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = ["nexigon"]
# Connection to Nexigon Hub: events, commands, and updates. See `src/nexigon.rs`.
nexigon = ["pico-platform/nexigon", "dep:embassy-net", "dep:embassy-sync"]

[dependencies]
bme280.workspace = true
cortex-m.workspace = true
cortex-m-rt.workspace = true
embassy-executor.workspace = true
embassy-net = { workspace = true, optional = true }
embassy-rp = { workspace = true, features = ["time-driver"] }
embassy-sync = { workspace = true, optional = true }
embassy-time.workspace = true
embedded-graphics.workspace = true
embedded-hal-bus.workspace = true
heapless.workspace = true
log.workspace = true
mipidsi.workspace = true
panic-reset.workspace = true
pico-platform.workspace = true
portable-atomic.workspace = true
static_cell.workspace = true

[build-dependencies]
pico-build.workspace = true
