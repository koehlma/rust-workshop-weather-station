[package]
name = "nexigon-mcu-rp-example"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[workspace]
members = ["bootloader"]

[features]
default = ["nexigon"]
# Connection to Nexigon Hub: events, commands, and updates. See `src/nexigon/`.
nexigon = [
    "dep:cyw43",
    "dep:cyw43-pio",
    "dep:embassy-boot",
    "dep:embassy-boot-rp",
    "dep:embassy-embedded-hal",
    "dep:embassy-futures",
    "dep:embassy-net",
    "dep:embassy-sync",
    "dep:embedded-io-async",
    "dep:embedded-tls",
    "dep:p256",
    "dep:sha2",
    "dep:sidex-embedded",
    "dep:signature",
]

[dependencies]
bme280 = "0.5"
cortex-m = "0.7"
cortex-m-rt = "0.7"
embassy-executor = { version = "0.10", features = ["platform-cortex-m", "executor-thread"] }
embassy-rp = { version = "0.10", features = ["rp2040", "critical-section-impl", "time-driver"] }
embassy-time = "0.5"
embassy-usb-logger = "0.6"
embedded-graphics = "0.8"
embedded-hal-bus = "0.3"
heapless = "0.8"
log = "0.4"
mipidsi = "0.10"
panic-reset = "0.1"
# Only enables a feature: The RP2040 lacks atomic compare-and-swap instructions, which
# `static_cell` needs, so atomics use critical sections instead.
portable-atomic = { version = "1", features = ["critical-section"] }
static_cell = "2"

# Dependencies of the `nexigon` feature.
cyw43 = { version = "0.7", optional = true }
cyw43-pio = { version = "0.10", optional = true }
embassy-boot = { version = "0.7", optional = true }
embassy-boot-rp = { version = "0.10", optional = true }
embassy-embedded-hal = { version = "0.6", optional = true }
embassy-futures = { version = "0.1", optional = true }
embassy-net = { version = "0.9", features = ["tcp", "udp", "dns", "dhcpv4", "proto-ipv4"], optional = true }
embassy-sync = { version = "0.8", optional = true }
embedded-io-async = { version = "0.7", optional = true }
embedded-tls = { version = "0.19", default-features = false, features = ["log"], optional = true }
p256 = { version = "0.13", default-features = false, features = ["ecdsa", "pkcs8"], optional = true }
sha2 = { version = "0.10", default-features = false, optional = true }
sidex-embedded = { git = "https://github.com/silitics/sidex", branch = "work/agents/rust-embedded", optional = true }
signature = { version = "2", default-features = false, optional = true }

[profile.release]
debug = 2
lto = true
opt-level = "s"

# Unknown TLS groups and signature schemes, which OpenSSL 3.5 offers, abort
# handshakes with `embedded-tls` 0.19.0. See `vendor/README.md`.
[patch.crates-io]
embedded-tls = { path = "vendor/embedded-tls" }
