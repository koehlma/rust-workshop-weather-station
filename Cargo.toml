[workspace]
resolver = "3"
members = ["crates/apps/*", "crates/libs/pico-platform"]
# Build scripts run `pico-build` on the host, so it cannot be built for the
# target of the workspace.
exclude = ["crates/libs/pico-build"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
bme280 = "0.5"
cortex-m = "0.7"
cortex-m-rt = "0.7"
cyw43 = "0.7"
cyw43-pio = "0.10"
embassy-boot = "0.7"
embassy-boot-rp = "0.10"
embassy-embedded-hal = "0.6"
embassy-executor = { version = "0.10", features = ["platform-cortex-m", "executor-thread"] }
embassy-futures = "0.1"
embassy-net = { version = "0.9", features = ["tcp", "udp", "dns", "dhcpv4", "proto-ipv4"] }
embassy-rp = { version = "0.10", features = ["rp2040", "critical-section-impl"] }
embassy-sync = "0.8"
embassy-time = "0.5"
embassy-usb-logger = "0.6"
embedded-graphics = "0.8"
embedded-hal-bus = "0.3"
embedded-sdmmc = "0.10"
embedded-io-async = "0.7"
embedded-tls = { version = "0.19", default-features = false, features = ["log"] }
heapless = "0.8"
log = "0.4"
mipidsi = "0.10"
p256 = { version = "0.13", default-features = false, features = ["ecdsa", "pkcs8"] }
panic-reset = "0.1"
pico-build = { path = "crates/libs/pico-build" }
pico-platform = { path = "crates/libs/pico-platform" }
# Only enables a feature: The RP2040 lacks atomic compare-and-swap instructions, which
# `static_cell` needs, so atomics use critical sections instead.
portable-atomic = { version = "1", features = ["critical-section"] }
sha2 = { version = "0.10", default-features = false }
sidex-embedded = { git = "https://github.com/silitics/sidex", branch = "work/agents/rust-embedded" }
signature = { version = "2", default-features = false }
static_cell = "2"

[profile.release]
debug = 2
lto = true
opt-level = "s"

# Unknown TLS groups and signature schemes, which OpenSSL 3.5 offers, abort
# handshakes with `embedded-tls` 0.19.0. See `vendor/README.md`.
[patch.crates-io]
embedded-tls = { path = "vendor/embedded-tls" }
